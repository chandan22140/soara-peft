program: train_glue_deberta.py
method: bayes
project: glue-deberta-sst2-butterfly
metric:
  name: best_metric
  goal: maximize

parameters:
  task:
    value: sst2
  
  method:
    value: v2
  
  rank:
    value: 768

  lr:
    distribution: log_uniform_values
    min: 7e-5
    max: 1e-3
  
  epochs:
    value: 15
  
  weight_decay:
    min: 0.00001
    max: 0.01
    distribution: log_uniform_values

  batch-size:
    value: 32

command:
  - ${env}
  - python
  - ${program}
  - ${args}
  - --use-butterfly
